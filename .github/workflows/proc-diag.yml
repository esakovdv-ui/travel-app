name: Process diag (dispatch)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/proc-diag.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Why does staff-landing keep restarting
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.56.32.183
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== ПАМЯТЬ ==="
            free -m
            echo "swap:"; swapon --show 2>/dev/null || echo "swap отсутствует"

            echo ""
            echo "=== PM2 ==="
            pm2 list

            echo ""
            echo "=== PM2 describe staff-landing ==="
            pm2 describe staff-landing 2>/dev/null | grep -viE 'script args|interpreter args' | head -45

            echo ""
            echo "=== PM2 describe travel-app ==="
            pm2 describe travel-app 2>/dev/null | grep -viE 'script args|interpreter args' | head -45

            echo ""
            echo "=== ЛОГ ОШИБОК staff-landing (последние 60) ==="
            pm2 logs staff-landing --err --lines 60 --nostream 2>/dev/null || true

            echo ""
            echo "=== ЛОГ ВЫВОДА staff-landing (последние 40) ==="
            pm2 logs staff-landing --out --lines 40 --nostream 2>/dev/null || true

            echo ""
            echo "=== ЛОГ ОШИБОК travel-app (последние 40) ==="
            pm2 logs travel-app --err --lines 40 --nostream 2>/dev/null || true

            echo ""
            echo "=== УБИЙСТВА ПО ПАМЯТИ В ЯДРЕ ==="
            (dmesg -T 2>/dev/null || dmesg 2>/dev/null) | grep -iE 'out of memory|oom-kill|killed process' | tail -20 || echo "записей нет"
            grep -iE 'oom|killed process' /var/log/syslog 2>/dev/null | tail -15 || true

            echo ""
            echo "=== 502/504 В NGINX ЗА СУТКИ ==="
            for log in /var/log/nginx/*access*.log; do
              [ -f "$log" ] || continue
              echo "--- $log ---"
              awk '$9 ~ /^(502|503|504)$/ {print $4, $9, $7}' "$log" | tail -25
              echo "всего 5xx: $(awk '$9 ~ /^5[0-9][0-9]$/' "$log" | wc -l)"
            done

            echo ""
            echo "=== ОШИБКИ NGINX ПРО UPSTREAM 3003 (портал) ==="
            grep -E '3003' /var/log/nginx/error.log 2>/dev/null | tail -20 || echo "нет"

            echo ""
            echo "=== МЕСТО НА ДИСКЕ ==="
            df -h / /home 2>/dev/null | head -5

            echo ""
            echo "=== ЧТО ЗАПУЩЕНО ДЛЯ ПОРТАЛА ==="
            ls -la /var/www/staff-landing 2>/dev/null | head -15
            cat /var/www/staff-landing/ecosystem.config.js 2>/dev/null || true
            cat /home/travel-app/apps/staff-landing/ecosystem.config.js 2>/dev/null || true
