name: Setup network TLS CDN

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTTP/2, ECDSA certs, Cloudflare real IP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.56.32.183
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            bash /home/travel-app/scripts/setup-network-tls-cdn.sh
