name: Deploy to production

on:
  push:
    branches:
      - main
      - feature/dima-auth
      - feature/arthur
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Нужен, чтобы понять, менялся ли staff-landing в этом пуше.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Нужно ли пересобирать staff-landing
        id: staff
        run: |
          BEFORE='${{ github.event.before }}'
          ZERO=0000000000000000000000000000000000000000

          # По умолчанию собираем. Пропускаем сборку только когда точно
          # убедились, что staff-landing не менялся: ошибка сравнения не должна
          # приводить к тихо пропущенному деплою.
          CHANGED=true
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ]; then
            if DIFF=$(git diff --name-only "$BEFORE" '${{ github.sha }}' 2>/dev/null); then
              if ! printf '%s\n' "$DIFF" | grep -q '^apps/staff-landing/'; then
                CHANGED=false
              fi
            else
              echo 'не удалось сравнить коммиты — собираем staff на всякий случай'
            fi
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "staff-landing менялся: $CHANGED"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          BITRIX_DOMAIN: ${{ secrets.BITRIX_DOMAIN }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          REBOOKING_WEBHOOK_TOKEN: ${{ secrets.REBOOKING_WEBHOOK_TOKEN }}
          TOURVISOR_AUTHKEY: ${{ secrets.TOURVISOR_AUTHKEY }}
          TOURVISOR_TOKEN: ${{ secrets.TOURVISOR_TOKEN }}
          LEVEL_TRAVEL_API_KEY: ${{ secrets.LEVEL_TRAVEL_API_KEY }}
          NEXT_PUBLIC_WL_BASE_URL: ${{ vars.NEXT_PUBLIC_WL_BASE_URL }}
          DEPLOY_STAFF: ${{ steps.staff.outputs.changed }}
        with:
          host: 72.56.32.183
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BITRIX_DOMAIN,WEBHOOK_TOKEN,REBOOKING_WEBHOOK_TOKEN,TOURVISOR_AUTHKEY,TOURVISOR_TOKEN,LEVEL_TRAVEL_API_KEY,NEXT_PUBLIC_WL_BASE_URL,DEPLOY_STAFF
          script: |
            set -e
            ENV_FILE=/home/travel-app/.env.local
            touch "$ENV_FILE"
            set_env_var() {
              key="$1"
              val="$2"
              if [ -z "$val" ]; then
                return 0
              fi
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i.bak "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
              else
                printf '%s=%s\n' "$key" "$val" >> "$ENV_FILE"
              fi
            }
            BITRIX_DOMAIN_VALUE="${BITRIX_DOMAIN:-crm.mosgortur.ru}"
            WEBHOOK_TOKEN_VALUE="${WEBHOOK_TOKEN:-1981/0ly7df3o8j23eq30}"
            REBOOKING_WEBHOOK_TOKEN_VALUE="${REBOOKING_WEBHOOK_TOKEN:-1981/j9pvdbhovvem7j6c}"
            [ -z "$BITRIX_DOMAIN_VALUE" ] && BITRIX_DOMAIN_VALUE="crm.mosgortur.ru"
            [ -z "$WEBHOOK_TOKEN_VALUE" ] && WEBHOOK_TOKEN_VALUE="1981/0ly7df3o8j23eq30"
            [ -z "$REBOOKING_WEBHOOK_TOKEN_VALUE" ] && REBOOKING_WEBHOOK_TOKEN_VALUE="1981/j9pvdbhovvem7j6c"
            set_env_var BITRIX_DOMAIN "$BITRIX_DOMAIN_VALUE"
            set_env_var WEBHOOK_TOKEN "$WEBHOOK_TOKEN_VALUE"
            set_env_var REBOOKING_BITRIX_DOMAIN "$BITRIX_DOMAIN_VALUE"
            set_env_var REBOOKING_WEBHOOK_TOKEN "$WEBHOOK_TOKEN_VALUE"
            set_env_var BITRIX_REST_BASE_URL "https://it.mosgortur.ru/b24catch"
            sed -i.bak '/^BITRIX_SYNC_MODE=/d' "$ENV_FILE"
            if [ -n "$TOURVISOR_AUTHKEY" ]; then
              set_env_var TOURVISOR_AUTHKEY "$TOURVISOR_AUTHKEY"
            fi
            if [ -n "$TOURVISOR_TOKEN" ]; then
              set_env_var TOURVISOR_TOKEN "$TOURVISOR_TOKEN"
            fi
            # Ключ Level Travel и адрес White Label переезжают только вместе.
            # Порознь они дают неработающую связку: поиск идёт по одному
            # партнёру, а ссылка ведёт на WL другого, и тот не узнаёт
            # request_id — карточка открывается на своих дефолтных датах.
            if [ -n "$LEVEL_TRAVEL_API_KEY" ]; then
              set_env_var LEVEL_TRAVEL_API_KEY "$LEVEL_TRAVEL_API_KEY"
              set_env_var NEXT_PUBLIC_WL_BASE_URL "${NEXT_PUBLIC_WL_BASE_URL:-https://mytrip.mosgortur.ru}"
            fi
            MAIN_EXIT=0
            /home/deploy.sh || MAIN_EXIT=$?
            # Раньше staff-landing пересобирался на каждом деплое, даже когда
            # в нём не было ни одной правки: rm -rf .next, полный npm install
            # и ещё одна сборка Next сразу после сборки travel-app. На машине
            # с 1.9 ГБ и одним ядром это и роняло деплой.
            if [ "$DEPLOY_STAFF" != "true" ]; then
              echo "staff-landing не менялся — пропускаем его пересборку"
            elif [ -f /home/travel-app/scripts/deploy-staff-landing.sh ]; then
              bash /home/travel-app/scripts/deploy-staff-landing.sh
            fi
            exit $MAIN_EXIT
